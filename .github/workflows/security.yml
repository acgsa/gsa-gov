# Security workflow — DISABLED until repo moves to a GHAS-enabled org.
#
# Why disabled:
#   - gitleaks-action v3 needs pull-requests:write; non-GHAS orgs return 403
#   - dependency-review-action requires GitHub Advanced Security
#
# To re-enable: remove the `if: false` on the _disabled job and restore the
# secrets-scan, sast, and dependency-review jobs from git history.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly — Mondays 08:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  _disabled:
    name: "Security checks pending GHAS org migration"
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Re-enable after org moves to GitHub Advanced Security"
