name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan — Mondays at 08:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read

# Use Node.js 24 actions (Node 20 deprecated on GitHub Actions from June 16, 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history so gitleaks can scan all commits

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Semgrep is free and does not require GitHub Advanced Security
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Semgrep
        run: semgrep ci --config=auto --json --output=semgrep-results.json || true
        env:
          # Optional: set SEMGREP_APP_TOKEN if you have a Semgrep Cloud account
          # for dashboard visibility. Scan still runs without it.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Fail on high-severity findings
        run: |
          python3 -c "
          import json, sys
          with open('semgrep-results.json') as f:
              data = json.load(f)
          high = [r for r in data.get('results', []) if r.get('extra', {}).get('severity', '').upper() in ('ERROR', 'WARNING')]
          if high:
              for r in high:
                  print(f\"{r['path']}:{r['start']['line']} [{r['extra']['severity']}] {r['check_id']}\")
              sys.exit(1)
          print(f'Semgrep: {len(data.get(\"results\", []))} total findings, 0 high/error severity')
          "

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Only on PRs — compares base vs head for new vulnerable deps
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
