name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Use Node.js 24 actions (Node 20 deprecated on GitHub Actions from June 16, 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on critical)
        # Audit level is 'critical' (not 'high') because next@15.4.11 HIGH CVEs
        # cannot be resolved until @payloadcms/next supports next >= 15.5.x.
        # Accepted risk documented in docs/risk-assessment.md.
        # Tighten back to 'high' once Payload peer dep constraint is resolved.
        run: npm audit --audit-level=critical

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, audit]
    env:
      # Non-secret build-time vars — real secrets never go here
      PAYLOAD_SECRET: ci-placeholder-not-real
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/gsa_gov
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_PAYLOAD_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
