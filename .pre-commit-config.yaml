repos:
  # ── Secrets scanning (highest priority) ───────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # ── TypeScript / JavaScript linting ───────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        files: \.(ts|tsx|js|jsx|mjs)$
        additional_dependencies:
          - eslint@9.17.0
          - eslint-config-next@15.0.0
          - typescript@5.7.3

  # ── Prettier formatting ────────────────────────────────────────────────────
  # Run via `npm run format:check` in CI (prettier is in package.json devDeps).
  # Local hook uses the project's own prettier install to avoid version drift.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        entry: npx prettier --check
        files: \.(ts|tsx|js|jsx|json|yml|yaml|css|scss|md)$
        pass_filenames: true
